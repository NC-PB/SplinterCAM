# SPDX-License-Identifier: Apache-2.0
# The splintercam package: metadata, the kernel build (scikit-build-core, ADR 0004) and tool settings
# (docs/dev/04, language appendix). Versions are pinned in uv.lock.

[build-system]
requires = ["scikit-build-core>=1.0.3", "nanobind>=3.1.0"]
build-backend = "scikit_build_core.build"

[project]
name = "splintercam"
version = "0.0.0"
description = "Open-source CAM for CNC milling and turning"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.13,<3.14"
dependencies = ["numpy>=2.5.3"]

[dependency-groups]
dev = [
  # Build: the project is built without isolation (see [tool.uv]), so these live in the venv.
  "scikit-build-core>=1.0.3",
  "nanobind>=3.1.0",
  "cmake>=4.4.3",
  "ninja>=1.13.2",
  # Format and lint (docs/dev/04).
  "ruff>=0.16.8",
  "pyright[nodejs]>=1.1.414",
  "clang-format>=23.1.1",
  "clang-tidy>=21.1.1",
  # Tests (docs/dev/06).
  "pytest>=9.1.1",
  "hypothesis>=6.168.1",
]
stack-test = [
    "cadquery-ocp-novtk==8.0.1.0.0",
    "pyside6-essentials==6.11.2",
]
# Plan 0001, the packaging smoke test (start of step 6): BeeWare Briefcase, BSD-3-Clause
# (Peter, 2026-10-02; Nuitka and PyInstaller fall under docs/dev/09's "not allowed" class).
packaging = [
    "briefcase==0.4.5",
]
# ADR 0010: shapely/GEOS (GEOS is LGPL-2.1) as a differential reference for tests only. Never in
# [project] dependencies; only files under tests/ import it; Briefcase installs no groups.
test-oracle = [
    "shapely>=2.2.0",
]

[tool.uv]
# Every `uv sync` (tools/bootstrap, tools/build, CI) installs these, so test 20 of offset2d runs
# everywhere without skipping (ADR 0010). stack-test and packaging stay opt-in.
default-groups = ["dev", "test-oracle"]
# uv-managed CPython everywhere, so every machine and CI runner uses the same build of Python.
python-preference = "only-managed"
# Built in the venv with a persistent build/ folder: CMake then recompiles only what changed.
no-build-isolation-package = ["splintercam"]
# uv rebuilds the editable install when one of these changes (tools/build).
cache-keys = [
  { file = "pyproject.toml" },
  { file = "CMakeLists.txt" },
  { file = "cmake/**/*" },
  { file = "src/splintercam/**/kernel/**/*" },
  # A new package must reach the editable install's module map, or it imports as an empty namespace.
  { file = "src/splintercam/**/__init__.py" },
]

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
cmake.build-type = "Release"
wheel.packages = ["src/splintercam"]
# Only our own install rules; fetched kernel libraries (CMakeLists.txt) install nothing.
install.components = ["splintercam"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "tests/support", "tools/lib"]
# Generated by tools/build from the kernels.
extend-exclude = ["src/splintercam/_kernels", "src/splintercam/_kernels.pyi"]

[tool.ruff.lint]
select = [
  "B",   # bugbear
  "BLE", # no blind `except Exception` (docs/dev/04, errors)
  "C4",
  "C90", # function complexity (docs/dev/12, section 3)
  "E",
  "F",
  "I",   # import order
  "N",   # naming (docs/dev/04)
  "PGH", # no blanket `# noqa` or `# type: ignore`: name the rule (docs/dev/04)
  "PIE",
  "PLR0911", # returns per function (docs/dev/12, section 3)
  "PLR0912", # branches per function
  "PLR0913", # arguments per function
  "PLR0915", # statements per function
  "PT",  # pytest style
  "PTH", # pathlib
  "RUF",
  "SIM",
  "T20", # no print below layer 6 (docs/dev/04, logging)
  "TD",  # TODOs name an issue or plan: TODO(#123) (docs/dev/04)
  "UP",
  "W",
]
# TD003 wants an issue link on the next line; the ID in TODO(#123) replaces it.
ignore = ["TD003"]

# The hard function limits of docs/dev/12, section 3 (the pylint defaults ruff uses); declared
# tool settings, changed only by decision (D-139).
[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 12
max-returns = 6
max-statements = 50

[tool.ruff.lint.per-file-ignores]
"tools/**" = ["T20"]
"tests/**" = ["T20"]
"spikes/**" = ["T20"]

[tool.pyright]
include = ["src", "tests", "tools/lib"]
extraPaths = ["tools/lib", "tests/support"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportUnnecessaryTypeIgnoreComment = "error"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
# Shared test helpers (oracles, generators), imported by module name: tests/support/README.md.
pythonpath = ["tests/support"]
addopts = ["--import-mode=importlib", "--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
# A warning during a test (NumPy NaN or overflow, a deprecation) fails it (AGENTS.md: no new warnings).
filterwarnings = ["error"]
markers = ["req(id): the requirement a test verifies, for example req(\"REQ-OFF-003\")"]
